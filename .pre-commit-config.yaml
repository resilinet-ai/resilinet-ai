repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-yaml
      - id: check-toml
      # Recovered design originals are kept byte-for-byte (docs/design/README.md).
      - id: end-of-file-fixer
        exclude: ^docs/design/wireframes/v0\.1/
      - id: trailing-whitespace
        exclude: ^docs/design/wireframes/v0\.1/
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: detect-private-key
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.4 # must equal the ruff version in uv.lock (tests/unit/test_tooling.py)
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks
