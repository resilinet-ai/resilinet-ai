# Resilinet-AI local stack (Architecture section 9).
# Profiles: core (RAI control plane) and sandbox (SandboxBank system under test).
# Services marked TODO arrive with the backlog items named next to them.
# Copy .env.example to .env and set the passwords before running.

name: resilinet-ai

services:
  # ---- core profile: control plane ----
  rai-db:
    profiles: ["core"]
    image: postgres:16@sha256:23fdb7b8156ad34bc663ed911f360764c5a5e237d6d70d1e379e025f63439a2f
    environment:
      POSTGRES_DB: rai
      POSTGRES_USER: rai
      POSTGRES_PASSWORD: ${RAI_DB_PASSWORD:?set RAI_DB_PASSWORD in .env}
    volumes:
      - rai-db-data:/var/lib/postgresql/data
    networks: [control_net]
    ports:
      - "127.0.0.1:55431:5432" # host-only, for `rai db upgrade`
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rai -d rai"]
      interval: 5s
      retries: 10
  rai-api:
    # B-36: plain HTTP on edge_net only, behind Caddy; no host port. Needs `rai db upgrade`
    # and `rai db set-api-password` once (from the host, through rai-db's 55431).
    profiles: ["core"]
    build:
      context: .
      dockerfile: deploy/rai/Dockerfile
    # Trust X-Forwarded-For only from Caddy's fixed address on edge_net.
    command: ["rai", "serve", "--host", "0.0.0.0", "--port", "8000",
              "--forwarded-allow-ips", "172.31.236.2"]
    environment:
      # Not ${VAR:?}: compose checks those for every profile, and the sandbox profiles
      # do not need them. rai serve refuses to start without them instead.
      RAI_API_DATABASE_URL: postgresql://rai_api:${RAI_API_DB_PASSWORD:-}@rai-db:5432/rai
      RAI_JWT_SECRET: ${RAI_JWT_SECRET:-}
      RAI_EVIDENCE_SIGNING_KEY: ${RAI_EVIDENCE_SIGNING_KEY:-} # B-35; empty = unsigned bundles
    depends_on:
      rai-db:
        condition: service_healthy
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    networks:
      control_net: {}
      edge_net:
        ipv4_address: 172.31.236.3 # fixed too, so it never takes Caddy's .2 first
  caddy:
    # B-36 (NFR-SEC-2, threat I-06): the only way in. HTTPS only; see deploy/caddy/Caddyfile.
    # The image is caddy:2.11.8 with the web UI built in (deploy/caddy/Dockerfile).
    profiles: ["core"]
    build:
      context: .
      dockerfile: deploy/caddy/Dockerfile
    environment:
      RAI_SITE_ADDRESS: ${RAI_SITE_ADDRESS:-localhost}
      RAI_TLS: ${RAI_TLS:-internal} # or an email address for ACME on a public name
    volumes:
      - caddy-data:/data # certificates and the local CA's key
      - caddy-config:/config
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    depends_on:
      rai-api:
        condition: service_healthy
    networks:
      edge_net:
        ipv4_address: 172.31.236.2
      public_net: {}
    ports:
      # Host-only by default; set RAI_HTTPS_BIND=0.0.0.0 and RAI_HTTPS_PORT=443 to serve a network.
      - "${RAI_HTTPS_BIND:-127.0.0.1}:${RAI_HTTPS_PORT:-8443}:443"
  # TODO B-18: rai-worker as a service (it runs on the host for now, `rai worker`)

  # ---- sandbox profile: SandboxBank (synthetic data only) ----
  ledger-db:
    profiles: ["sandbox"]
    image: postgres:16@sha256:23fdb7b8156ad34bc663ed911f360764c5a5e237d6d70d1e379e025f63439a2f
    labels:
      rai.sandbox: "true"
      rai.target: ledger-db
    environment:
      POSTGRES_DB: ledger
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ${LEDGER_DB_PASSWORD:?set LEDGER_DB_PASSWORD in .env}
    volumes:
      - ledger-db-data:/var/lib/postgresql/data
    networks: [sandbox_net]
    ports:
      - "127.0.0.1:55432:5432" # host-only, for `sandboxbank load-reference`
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger -d ledger"]
      interval: 5s
      retries: 10
  payments-api:
    profiles: ["sandbox"]
    build:
      context: .
      dockerfile: sandboxbank/Dockerfile
    labels:
      rai.sandbox: "true"
      rai.target: payments-api
    environment:
      # Through Toxiproxy (ledger-db-proxy), so network faults can reach this path (B-23).
      SANDBOXBANK_LEDGER_DSN: postgresql://ledger:${LEDGER_DB_PASSWORD:?set LEDGER_DB_PASSWORD in .env}@toxiproxy:15432/ledger
    depends_on:
      ledger-db:
        condition: service_healthy
      toxiproxy:
        condition: service_started
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [sandbox_net]
    ports:
      - "127.0.0.1:18080:8080" # host-only, for `sandboxbank post`
  analytics-db:
    profiles: ["sandbox"]
    image: postgres:16@sha256:23fdb7b8156ad34bc663ed911f360764c5a5e237d6d70d1e379e025f63439a2f
    labels:
      rai.sandbox: "true"
      rai.target: analytics-db
    environment:
      POSTGRES_DB: analytics
      POSTGRES_USER: analytics
      POSTGRES_PASSWORD: ${ANALYTICS_DB_PASSWORD:?set ANALYTICS_DB_PASSWORD in .env}
    volumes:
      - analytics-db-data:/var/lib/postgresql/data
    networks: [sandbox_net]
    ports:
      - "127.0.0.1:55434:5432" # host-only, for inspecting the warehouse
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U analytics -d analytics"]
      interval: 5s
      retries: 10
  etl-job:
    profiles: ["sandbox"]
    build:
      context: .
      dockerfile: sandboxbank/Dockerfile
    command: ["sandboxbank", "etl", "--interval", "${ETL_INTERVAL_SECONDS:-60}"]
    restart: unless-stopped # S12/S16: stopped or restarted mid-load, it resumes from the watermark
    healthcheck:
      disable: true # the image's check probes payments-api's HTTP port, which the ETL lacks
    labels:
      rai.sandbox: "true"
      rai.target: etl-job
    environment:
      SANDBOXBANK_LEDGER_DSN: postgresql://ledger:${LEDGER_DB_PASSWORD:?set LEDGER_DB_PASSWORD in .env}@toxiproxy:15432/ledger
      SANDBOXBANK_ANALYTICS_DSN: postgresql://analytics:${ANALYTICS_DB_PASSWORD:?set ANALYTICS_DB_PASSWORD in .env}@toxiproxy:15434/analytics
    depends_on:
      ledger-db:
        condition: service_healthy
      analytics-db:
        condition: service_healthy
      toxiproxy:
        condition: service_started
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [sandbox_net]
  toxiproxy:
    profiles: ["sandbox"]
    image: ghcr.io/shopify/toxiproxy:2.13.0@sha256:5d3dae09bc185dcc5ff6cf43abf6062a4a720aff0c4306a471e773acdcd107aa
    command: ["-host=0.0.0.0", "-config=/config/toxiproxy.json"]
    labels:
      rai.sandbox: "true"
      rai.target: toxiproxy
    volumes:
      - ./sandboxbank/toxiproxy.json:/config/toxiproxy.json:ro # ledger-db-proxy, analytics-db-proxy
    # The admin API (8474) is on chaos_net only: just the chaos agent can configure faults (TB5).
    networks: [sandbox_net, chaos_net]
  # B-02: the generator is a CLI (`sandboxbank generate`), not a service.

  # ---- observer profile: RTO ground truth (opt in: --profile sandbox --profile observer) ----
  rai-observer:
    # B-44 (Protocol H3): part of no arm. Every 250 ms it checks payments-api's /readyz and
    # reads the ledger head straight from ledger-db (not through Toxiproxy), on its own
    # monotonic clock, into a hash-chained log on its own volume. No rai.sandbox label,
    # so no fault can target it.
    profiles: ["observer"]
    build:
      context: .
      dockerfile: sandboxbank/Dockerfile
    command: ["sandboxbank", "observe", "--api", "http://payments-api:8080",
              "--log", "/var/lib/sandboxbank-observer/observations.csv"]
    healthcheck:
      disable: true # the image's check probes payments-api's HTTP port, which the observer lacks
    environment:
      SANDBOXBANK_LEDGER_DSN: postgresql://ledger:${LEDGER_DB_PASSWORD:?set LEDGER_DB_PASSWORD in .env}@ledger-db:5432/ledger
    volumes:
      - observer-log:/var/lib/sandboxbank-observer
    restart: unless-stopped # a restart continues the same chain
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [sandbox_net]

  # ---- chaos profile: fault injection (opt in: --profile sandbox --profile chaos) ----
  socket-proxy:
    profiles: ["chaos"]
    image: wollomatic/socket-proxy:1.13.2@sha256:ff95d6ff6c27853005ef85eb8f4ab5923dc3d2f1e055f98fb6aeeaceec3fe848
    # Exactly the verbs the chaos agent needs (threat E-01): list and inspect containers;
    # stop, start, restart, pause, unpause; network connect and disconnect. No exec, no
    # images, no volumes, no create. Only the agent and its watchdog (B-25) may connect.
    command:
      - -listenip=0.0.0.0
      - -allowfrom=rai-chaos-agent,rai-chaos-watchdog
      - -allowGET=/v1\.41/containers/(json|[a-zA-Z0-9_.-]+/json)
      - -allowPOST=/v1\.41/(containers/[a-zA-Z0-9_.-]+/(stop|start|restart|pause|unpause)|networks/[a-zA-Z0-9_.-]+/(connect|disconnect))
      - -watchdoginterval=30
      - -stoponwatchdog
    user: "65534:${DOCKER_GID:-0}" # the group that owns the Docker socket on this host
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [chaos_net]
  rai-chaos-agent:
    profiles: ["chaos"]
    build:
      context: .
      dockerfile: chaos_agent/Dockerfile
    # No rai.sandbox label: the agent can never target itself or the socket proxy.
    environment:
      RAI_AGENT_TOXIPROXY_URL: http://toxiproxy:8474
      RAI_AGENT_DOCKER_URL: http://socket-proxy:2375
      # B-24: only fault requests signed by these worker public keys are applied
      # (`rai admin chaos-keygen` prints one); with none, every fault request is refused.
      RAI_AGENT_WORKER_KEYS: ${RAI_AGENT_WORKER_KEYS:-}
      RAI_AGENT_ENVIRONMENT: ${RAI_AGENT_ENVIRONMENT:-SANDBOXBANK} # the one environment it serves
    volumes:
      - chaos-agent-state:/var/lib/rai-chaos-agent # active faults survive a crash (R-03)
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on: [socket-proxy, toxiproxy]
    networks: [chaos_net, bridge_net]
    ports:
      - "127.0.0.1:18090:8090" # host-only: `kill --all` and the end-to-end check
  rai-chaos-watchdog:
    # B-25 (threat D-01): reverts any fault past its deadline whatever happens to the
    # agent. Same image, its own process and container; no HTTP interface and no
    # bridge_net, so nothing can ask it to inject. Shares only the state volume.
    profiles: ["chaos"]
    build:
      context: .
      dockerfile: chaos_agent/Dockerfile
    command: ["rai-chaos-agent", "watchdog"]
    environment:
      RAI_AGENT_TOXIPROXY_URL: http://toxiproxy:8474
      RAI_AGENT_DOCKER_URL: http://socket-proxy:2375
      RAI_WATCHDOG_GRACE_SECONDS: ${RAI_WATCHDOG_GRACE_SECONDS:-30} # after a fault's duration
    volumes:
      - chaos-agent-state:/var/lib/rai-chaos-agent
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "rai-chaos-agent", "watchdog-health"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    depends_on: [socket-proxy, toxiproxy]
    networks: [chaos_net]

networks:
  control_net: {}
  edge_net:
    # B-36: Caddy and rai-api only; no route out. The fixed subnet gives Caddy a fixed
    # address for rai-api's --forwarded-allow-ips.
    internal: true
    ipam:
      config:
        - subnet: 172.31.236.0/28
  public_net: {} # Caddy's published port and ACME
  sandbox_net: {}
  bridge_net: {}
  chaos_net:
    internal: true # no route out: the socket proxy and Toxiproxy admin stay inside

volumes:
  rai-db-data: {}
  caddy-data: {}
  caddy-config: {}
  ledger-db-data: {}
  analytics-db-data: {}
  chaos-agent-state: {}
  observer-log: {}
