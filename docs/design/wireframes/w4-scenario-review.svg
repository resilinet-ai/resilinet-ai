erwise (FR-07.2).</text><circle cx="29" cy="674" r="9" class="co"/><text x="29" y="678" class="cot" text-anchor="middle">2</text><text x="46" y="678" class="note">Approvals are append-only; the status shown is the latest decision for this version (NFR-AUD-1).</text><circle cx="29" cy="696" r="9" class="co"/><text x="29" y="700" class="cot" text-anchor="middle">3</text><text x="46" y="700" class="note">Controls a role cannot use are disabled with the reason; the database also refuses self-approval (FR-07.2, ADR-007).</text><circle cx="29" cy="718" r="9" class="co"/><text x="29" y="722" class="cot" text-anchor="middle">4</text><text x="46" y="722" class="note">Durations are checked against the environment's ceiling (default 15 min, at most 60) and again by the chaos agent.</text></svg>
