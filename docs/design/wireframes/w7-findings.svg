ate</text><text x="636" y="212" class="s">Source</text><text x="710" y="212" class="t">run 9d70… · observation duplicates.cross_batch</text><text x="636" y="234" class="s">Owner</text><text x="710" y="234" class="t">A. Engineer</text><text x="636" y="256" class="s">Fix</text><text x="710" y="256" class="t">PR #41 (linked)</text><text x="636" y="278" class="s">Retest</text><text x="710" y="278" class="t">✕ not run yet: a passing retest closes it</text><circle cx="984" cy="212" r="9" class="co"/><text x="984" y="216" class="cot" text-anchor="middle">2</text><line x1="636" y1="298" x2="984" y2="298" class="line"/><text x="636" y="322" class="h2">Request a waiver</text><text x="636" y="340" class="s">Reason (required)</text><rect x="636" y="346" width="348" height="28" rx="3" class="input"/><text x="636" y="396" class="s">Expires on (required)</text><rect x="636" y="402" width="170" height="28" rx="3" class="input"/><text x="644" y="421" class="t">2026-12-15</text><text x="820" y="396" class="s">Approver (not you)</text><rect x="820" y="402" width="164" height="28" rx="3" class="input"/><text x="828" y="421" class="t">R. Reviewer  ▾</text><rect x="636" y="452" width="150" height="28" rx="4" class="btn"/><text x="711.0" y="470.5" class="btnt" text-anchor="middle">Request waiver</text><text x="636" y="504" class="s">Until a named reviewer approves it, the gate stays blocked.</text><text x="636" y="520" class="s">When the waiver expires, the finding blocks again.</text><circle cx="984" cy="318" r="9" class="co"/><text x="984" y="322" class="cot" text-anchor="middle">3</text><circle cx="984" cy="410" r="9" class="co"/><text x="984" y="414" class="cot" text-anchor="middle">4</text><text x="20" y="610" class="h2">Notes</text><circle cx="29" cy="632" r="9" class="co"/><text x="29" y="636" class="cot" text-anchor="middle">1</text><text x="46" y="636" class="note">Severity and gate effect are words and icons; the selected row is outlined, not only shaded (NFR-USE-2).</text><circle cx="29" cy="654" r="9" class="co"/><text x="29" y="658" class="cot" text-anchor="middle">2</text><text x="46" y="658" class="note">A finding has a severity, an owner, a fix and a retest; it closes only on a passing retest (FR-10.1).</text><circle cx="29" cy="676" r="9" class="co"/><text x="29" y="680" class="cot" text-anchor="middle">3</text><text x="46" y="680" class="note">A critical finding blocks the gate unless waived with an expiry date (FR-12.2).</text><circle cx="29" cy="698" r="9" class="co"/><text x="29" y="702" class="cot" text-anchor="middle">4</text><text x="46" y="702" class="note">Approval is by a named reviewer, never the requester (FR-12.1). Screen waits on the findings API (B-33).</text></svg>
