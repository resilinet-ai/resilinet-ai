<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="680" viewBox="0 0 1040 680" role="img" aria-label="RAI wireframe w1-sign-in"><style>
text { font-family: "Segoe UI", system-ui, -apple-system, Arial, sans-serif; fill: #1f2933; }
.t { font-size: 12px; }
.s { font-size: 11px; fill: #52606d; }
.b { font-size: 12px; font-weight: 600; }
.h1 { font-size: 18px; font-weight: 600; }
.h2 { font-size: 14px; font-weight: 600; }
.title { font-size: 15px; font-weight: 700; fill: #0b3954; }
.tag { font-size: 11px; font-weight: 600; fill: #8a4b00; }
.mono { font-family: Consolas, "Courier New", monospace; font-size: 11.5px; }
.big { font-size: 24px; font-weight: 600; }
.ban { font-size: 12px; font-weight: 700; fill: #5c3d00; letter-spacing: .4px; }
.navt { font-size: 12px; fill: #323f4b; }
.nava { font-size: 12px; font-weight: 600; fill: #0b3954; }
.btnt { font-size: 12px; font-weight: 600; fill: #ffffff; }
.btn2t { font-size: 12px; font-weight: 600; fill: #0b3954; }
.dist { font-size: 12px; font-weight: 600; fill: #9aa5b1; }
.cot { font-size: 11px; font-weight: 700; fill: #ffffff; }
.note { font-size: 11.5px; fill: #323f4b; }
.frame { fill: #ffffff; stroke: #7b8794; stroke-width: 1.5; }
.panel { fill: #ffffff; stroke: #cbd2d9; }
.fill { fill: #f5f7fa; stroke: #cbd2d9; }
.thead { fill: #e4e7eb; stroke: #cbd2d9; }
.sel { fill: #e6f0f7; stroke: #0b3954; }
.input { fill: #ffffff; stroke: #9aa5b1; }
.banner { fill: #fff1c7; stroke: #c98a00; }
.nav { fill: #f5f7fa; stroke: #cbd2d9; }
.btn { fill: #0b3954; }
.btn2 { fill: #ffffff; stroke: #0b3954; }
.dis { fill: #f5f7fa; stroke: #cbd2d9; stroke-dasharray: 4 3; }
.chip { fill: #ffffff; stroke: #7b8794; }
.chipbad { fill: #ffffff; stroke: #1f2933; stroke-width: 2; }
.co { fill: #c2410c; }
.bar { fill: #9fb3c8; }
.line { stroke: #cbd2d9; }
.arrow { stroke: #52606d; stroke-width: 1.5; fill: none; marker-end: url(#a); }
</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#52606d"/></marker></defs><rect width="1040" height="680" fill="#ffffff"/><text x="20" y="26" class="title">W1  Sign-in and tenant choice</text><rect x="20" y="40" width="1000" height="470" rx="6" class="frame"/><rect x="21" y="41" width="998" height="30" rx="5" class="banner"/><text x="36" y="61" class="ban">⚠  RAI RUNS ON SANDBOX AND STAGING DATA ONLY — NEVER PRODUCTION</text><line x1="20" y1="112" x2="1020" y2="112" class="line"/><rect x="34" y="80" width="46" height="24" rx="4" class="btn"/><text x="57" y="97" class="btnt" text-anchor="middle">RAI</text><text x="94" y="97" class="t">Sign in</text><rect x="110" y="150" width="360" height="320" rx="6" class="panel"/><text x="134" y="188" class="h1">Sign in to RAI</text><text x="134" y="222" class="s">Email</text><rect x="134" y="228" width="312" height="28" rx="3" class="input"/><text x="142" y="247" class="t">a.user@example.org</text><text x="134" y="278" class="s">Password</text><rect x="134" y="284" width="312" height="28" rx="3" class="input"/><text x="142" y="303" class="t">••••••••••••</text><rect x="134" y="334" width="312" height="28" rx="4" class="btn"/><text x="290.0" y="352.5" class="btnt" text-anchor="middle">Sign in</text><rect x="134" y="378" width="312" height="30" rx="3" class="fill"/><text x="144" y="397" class="b">✕  Email or password is wrong</text><circle cx="460" cy="393" r="9" class="co"/><text x="460" y="397" class="cot" text-anchor="middle">1</text><text x="134" y="434" class="s">After repeated failures: “Too many failed sign-ins;</text><text x="134" y="450" class="s">try again later” (Retry-After shown as a countdown).</text><circle cx="460" cy="442" r="9" class="co"/><text x="460" y="446" class="cot" text-anchor="middle">2</text><path d="M482 310 L520 310" class="arrow"/><rect x="530" y="150" width="400" height="320" rx="6" class="panel"/><text x="554" y="188" class="h1">Choose a tenant</text><text x="554" y="210" class="s">Signed in as A. User · a.user@example.org</text><circle cx="914" cy="184" r="9" class="co"/><text x="914" y="188" class="cot" text-anchor="middle">3</text><rect x="554" y="230" width="352" height="44" rx="4" class="sel"/><text x="568" y="249" class="b">Credit Union Sandbox</text><text x="568" y="265" class="s">cu-sandbox</text><rect x="790" y="242" width="82" height="20" rx="10" class="chip"/><text x="831.0" y="256" class="t" text-anchor="middle">engineer</text><text x="892" y="257" class="b">›</text><rect x="554" y="284" width="352" height="44" rx="4" class="fill"/><text x="568" y="303" class="b">Research Lab</text><text x="568" y="319" class="s">research-lab</text><rect x="790" y="296" width="82" height="20" rx="10" class="chip"/><text x="831.0" y="310" class="t" text-anchor="middle">reviewer</text><text x="892" y="311" class="b">›</text><rect x="554" y="338" width="352" height="44" rx="4" class="fill"/><text x="568" y="357" class="b">Demo Fintech</text><text x="568" y="373" class="s">demo-fintech</text><rect x="790" y="350" width="82" height="20" rx="10" class="chip"/><text x="831.0" y="364" class="t" text-anchor="middle">viewer</text><text x="892" y="365" class="b">›</text><text x="554" y="408" class="s">No tenant listed? Tenants are created by the operator</text><text x="554" y="424" class="s">(rai admin create-tenant); ask an admin to invite you.</text><circle cx="914" cy="416" r="9" class="co"/><text x="914" y="420" class="cot" text-anchor="middle">4</text><circle cx="1006" cy="56" r="9" class="co"/><text x="1006" y="60" class="cot" text-anchor="middle">5</text><text x="20" y="540" class="h2">Notes</text><circle cx="29" cy="562" r="9" class="co"/><text x="29" y="566" class="cot" text-anchor="middle">1</text><text x="46" y="566" class="note">The same message for an unknown email, a wrong password and a disabled or invited account (threat S-01).</text><circle cx="29" cy="584" r="9" class="co"/><text x="29" y="588" class="cot" text-anchor="middle">2</text><text x="46" y="588" class="note">Failures are throttled per email and per address; the wait comes from the API's Retry-After header.</text><circle cx="29" cy="606" r="9" class="co"/><text x="29" y="610" class="cot" text-anchor="middle">3</text><text x="46" y="610" class="note">Tenants and roles come from GET /me (FR-01.1); the role is shown as a word, not a colour.</text><circle cx="29" cy="628" r="9" class="co"/><text x="29" y="632" class="cot" text-anchor="middle">4</text><text x="46" y="632" class="note">The API cannot create tenants (threat E-04), so the screen explains how to get one instead of offering a button.</text><circle cx="29" cy="650" r="9" class="co"/><text x="29" y="654" class="cot" text-anchor="middle">5</text><text x="46" y="654" class="note">Before a project is chosen the banner states the operating boundary; afterwards it shows the project's classification (FR-11.2).</text></svg>
