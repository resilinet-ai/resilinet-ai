[project]
name = "resilinet-ai"
version = "0.0.1"
description = "Resilinet-AI (RAI): open reference framework for data-integrity validation, controlled chaos testing and measurable recovery of AI-enabled financial data pipelines."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Trevor Kauyu" }]
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.7",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pyyaml>=6.0",
    "polars>=2.1,<3",
]

[project.scripts]
rai = "rai.cli.main:app"

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "import-linter>=2.0",
    "pre-commit>=3.8",
    "pip-audit>=2.7",
    "httpx>=0.27",
    "types-pyyaml>=6.0,<6.0.12.20261112",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rai"]

[tool.uv.workspace]
members = ["chaos_agent", "sandboxbank", "benchmarks"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "chaos_agent/src", "sandboxbank/src", "benchmarks/src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "C4", "SIM", "RUF", "PT"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["rai", "chaos_agent", "sandboxbank", "rai_bench", "scripts"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S608"] # tests build SQL only from constants
"src/rai/migrations/versions/*" = ["E501"] # SQL reads better unwrapped
"tests/unit/test_contract.py" = ["S101", "E501"] # inline YAML samples read better unwrapped

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "chaos_agent/src", "sandboxbank/src", "benchmarks/src", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
pythonpath = ["."]

[tool.coverage.run]
source = ["rai", "sandboxbank", "rai_bench"]
branch = true
# Alembic exec()s env.py, which coverage cannot trace; every migration test runs it.
omit = ["*/rai/migrations/env.py"]

[tool.importlinter]
root_packages = ["rai"]

[[tool.importlinter.contracts]]
name = "Domain core does not depend on delivery layers"
type = "forbidden"
source_modules = ["rai.core"]
forbidden_modules = ["rai.api", "rai.cli", "rai.worker"]

[[tool.importlinter.contracts]]
name = "Engines are independent of each other"
type = "independence"
modules = ["rai.validation", "rai.recovery", "rai.tevv", "rai.lineage"]
