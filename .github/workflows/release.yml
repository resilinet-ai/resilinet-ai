# B-41 (NFR-REP-2, NFR-SEC-3): a release from a version tag, as docs/releasing.md describes.
# The tag must match every version in the repository, have release notes that are no
# longer a draft, and point at a commit on main. The workflow then builds and signs the
# Python packages and the four images exactly as "Images" does on main (SBOM, blocking
# scan, then cosign keyless), and collects everything in a DRAFT GitHub release. The
# author publishes it only after the reproduction on a clean 8 GB laptop.
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Check the tag, sign the packages, draft the release
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the draft release
      id-token: write # cosign keyless signature of the checksums
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: The tag matches every version and has final release notes
        run: uv run --no-project python scripts/release.py check "$TAG"
      - name: The tagged commit is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: The lock is current
        run: uv lock --check
      - name: Build the Python packages
        run: uv build --all-packages --out-dir dist
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Checksums, signed keylessly
        working-directory: dist
        run: |
          sha256sum -- * > SHA256SUMS
          cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS
      - name: Draft the release
        run: |
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "RAI $TAG" --notes-file "docs/releases/$TAG.md" dist/*

  images:
    name: Release image ${{ matrix.name }} (SBOM, scan, sign)
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: write # attach the SBOM to the draft release
      packages: write # push to ghcr.io/<owner>
      id-token: write # the OIDC token cosign exchanges for a short-lived signing certificate
    strategy:
      fail-fast: true
      matrix:
        include:
          - { name: rai-api, dockerfile: deploy/rai/Dockerfile }
          - { name: rai-caddy, dockerfile: deploy/caddy/Dockerfile }
          - { name: rai-chaos-agent, dockerfile: chaos_agent/Dockerfile }
          - { name: rai-sandboxbank, dockerfile: sandboxbank/Dockerfile }
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          tags: ${{ env.IMAGE }}:${{ github.ref_name }},${{ env.IMAGE }}:sha-${{ github.sha }}
          push: true
          provenance: mode=max
      - name: SBOM (SPDX) of the pushed digest
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          artifact-name: ${{ matrix.name }}.spdx.json
          upload-release-assets: false
      - name: No critical vulnerability with a fix (before signing)
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          sbom: sbom.spdx.json
          fail-build: true
          severity-cutoff: critical
          only-fixed: true
          output-format: table
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Sign the digest and attest the SBOM (keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "$IMAGE@$DIGEST"
          cosign attest --yes --type spdxjson --predicate sbom.spdx.json "$IMAGE@$DIGEST"
          echo "### $IMAGE@$DIGEST" >> "$GITHUB_STEP_SUMMARY"
      - name: Attach the SBOM to the draft release
        env:
          NAME: ${{ matrix.name }}
        run: |
          cp sbom.spdx.json "$NAME.spdx.json"
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" "$NAME.spdx.json"

  digests:
    name: List the signed image digests in the release
    needs: images
    runs-on: ubuntu-latest
    permissions:
      contents: write # attach images.txt to the draft release
      packages: read
    env:
      TAG: ${{ github.ref_name }}
      OWNER: ${{ github.repository_owner }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: images.txt
        run: |
          for name in rai-api rai-caddy rai-chaos-agent rai-sandboxbank; do
            image="ghcr.io/$OWNER/$name"
            digest="$(docker buildx imagetools inspect "$image:$TAG" --format '{{json .Manifest.Digest}}' | tr -d '"')"
            echo "$image@$digest" >> images.txt
          done
          cat images.txt | tee -a "$GITHUB_STEP_SUMMARY"
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" images.txt
