# Container images (B-40: NFR-SEC-3; threat model T-08, T-10).
# Every pull request builds the four images, records an SPDX SBOM for each and fails on a
# critical vulnerability that has a fix. On main, the images are pushed to GHCR, scanned
# again by digest, and only then signed keylessly with cosign (Sigstore, GitHub OIDC),
# with the SBOM attached as a signed attestation. docs/supply-chain.md shows how to verify.
name: Images

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Image ${{ matrix.name }} (SBOM and scan)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: rai-api, dockerfile: deploy/rai/Dockerfile }
          - { name: rai-caddy, dockerfile: deploy/caddy/Dockerfile }
          - { name: rai-chaos-agent, dockerfile: chaos_agent/Dockerfile }
          - { name: rai-sandboxbank, dockerfile: sandboxbank/Dockerfile }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          tags: local/${{ matrix.name }}:ci
          load: true
          push: false
      - name: SBOM (SPDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: local/${{ matrix.name }}:ci
          format: spdx-json
          artifact-name: ${{ matrix.name }}.spdx.json
          upload-release-assets: false
      - name: No critical vulnerability with a fix
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: local/${{ matrix.name }}:ci
          fail-build: true
          severity-cutoff: critical
          only-fixed: true
          output-format: table

  publish:
    name: Publish signed images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to ghcr.io/<owner>
      id-token: write # the OIDC token cosign exchanges for a short-lived signing certificate
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: rai-api, dockerfile: deploy/rai/Dockerfile }
          - { name: rai-caddy, dockerfile: deploy/caddy/Dockerfile }
          - { name: rai-chaos-agent, dockerfile: chaos_agent/Dockerfile }
          - { name: rai-sandboxbank, dockerfile: sandboxbank/Dockerfile }
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          tags: ${{ env.IMAGE }}:sha-${{ github.sha }},${{ env.IMAGE }}:main
          push: true
          provenance: mode=max
      - name: SBOM (SPDX) of the pushed digest
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          artifact-name: ${{ matrix.name }}.spdx.json
          upload-release-assets: false
      - name: No critical vulnerability with a fix (before signing)
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          sbom: sbom.spdx.json
          fail-build: true
          severity-cutoff: critical
          only-fixed: true
          output-format: table
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Sign the digest and attest the SBOM (keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "$IMAGE@$DIGEST"
          cosign attest --yes --type spdxjson --predicate sbom.spdx.json "$IMAGE@$DIGEST"
          echo "### $IMAGE@$DIGEST" >> "$GITHUB_STEP_SUMMARY"
          echo "Signed, with an SPDX SBOM attestation." >> "$GITHUB_STEP_SUMMARY"
