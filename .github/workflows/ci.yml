name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * *" # nightly dependency audit

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  traceability:
    name: Requirement traceability
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: PR title names a known requirement ID
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: python scripts/check_traceability.py "$PR_TITLE"

  checks:
    name: Lint, types and tests
    runs-on: ubuntu-latest
    services:
      ledger-db:
        image: postgres:16
        env:
          POSTGRES_USER: ledger
          POSTGRES_PASSWORD: ci-only-not-secret
          POSTGRES_DB: ledger_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ledger -d ledger_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Install
        run: uv sync --all-packages --locked
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Mypy (strict)
        run: uv run mypy
      - name: Module boundaries
        run: uv run lint-imports
      - name: Tests with coverage (integration tests use the PostgreSQL service)
        env:
          SANDBOXBANK_TEST_DSN: postgresql://ledger:ci-only-not-secret@localhost:5432/ledger_test
          RAI_TEST_DSN: postgresql://ledger:ci-only-not-secret@localhost:5432/ledger_test
        run: uv run pytest --cov --cov-report=term-missing

  secrets:
    name: Secret scan and hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: pre-commit hooks (gitleaks, hygiene)
        run: |
          python -m pip install pre-commit
          pre-commit run --all-files --show-diff-on-failure

  audit:
    name: Dependency audit
    if: github.event_name == 'schedule' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Audit locked dependencies
        run: |
          uv export --all-packages --format requirements-txt --no-hashes --no-emit-workspace > requirements-audit.txt
          uvx pip-audit -r requirements-audit.txt
