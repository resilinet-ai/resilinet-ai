name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * *" # nightly dependency audit

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  traceability:
    name: Requirement traceability
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: PR title names a known requirement ID
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: python scripts/check_traceability.py "$PR_TITLE"

  checks:
    name: Lint, types and tests
    runs-on: ubuntu-latest
    services:
      ledger-db:
        image: postgres:16
        env:
          POSTGRES_USER: ledger
          POSTGRES_PASSWORD: ci-only-not-secret
          POSTGRES_DB: ledger_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ledger -d ledger_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Install (with the benchmark baselines' extras)
        run: uv sync --all-packages --all-extras --locked
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Mypy (strict)
        run: uv run mypy
      - name: Module boundaries
        run: uv run lint-imports
      - name: Tests with coverage (integration tests use the PostgreSQL service)
        env:
          SANDBOXBANK_TEST_DSN: postgresql://ledger:ci-only-not-secret@localhost:5432/ledger_test
          RAI_TEST_DSN: postgresql://ledger:ci-only-not-secret@localhost:5432/ledger_test
        run: uv run pytest --cov --cov-report=term-missing

  gate:
    # FR-06.1 acceptance: the RAI gate action against a live API and worker. A clean
    # plan must pass; a plan whose batch re-sends rows must fail the step.
    name: CI gate (rai run action)
    runs-on: ubuntu-latest
    services:
      rai-db:
        image: postgres:16
        env:
          POSTGRES_USER: ledger
          POSTGRES_PASSWORD: ci-only-not-secret
          POSTGRES_DB: rai_gate
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ledger -d rai_gate"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      RAI_DATABASE_URL: postgresql://ledger:ci-only-not-secret@localhost:5432/rai_gate
      RAI_GATE_EMAIL: gate-admin@example.test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Install
        run: uv sync --all-packages --locked
      - name: Generated credentials (masked) and worker folders
        run: |
          # The runner context is not available in job-level env, so set these here.
          echo "RAI_WORKER_STATE=$RUNNER_TEMP/gate/state" >> "$GITHUB_ENV"
          echo "RAI_WORKER_CONNECTORS=$RUNNER_TEMP/gate/connectors" >> "$GITHUB_ENV"
          for name in RAI_NEW_PASSWORD RAI_API_DB_PASSWORD RAI_WORKER_DB_PASSWORD RAI_JWT_SECRET; do
            value="$(uv run python -c 'import secrets; print(secrets.token_urlsafe(36))')"
            echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
          done
      - name: Database, login roles and a tenant
        run: |
          echo "RAI_API_DATABASE_URL=postgresql://rai_api:${RAI_API_DB_PASSWORD}@localhost:5432/rai_gate" >> "$GITHUB_ENV"
          echo "RAI_WORKER_DATABASE_URL=postgresql://rai_worker:${RAI_WORKER_DB_PASSWORD}@localhost:5432/rai_gate" >> "$GITHUB_ENV"
          uv run rai db upgrade
          uv run rai db set-api-password
          uv run rai db set-worker-password
          uv run rai admin create-tenant --slug gate --name "CI gate" \
            --admin-email "$RAI_GATE_EMAIL" --admin-name "Gate Admin"
      - name: Start the API and a worker
        run: |
          uv run python scripts/ci_gate.py data "$RUNNER_TEMP/gate"
          nohup uv run rai serve > "$RUNNER_TEMP/serve.log" 2>&1 &
          nohup uv run rai worker --poll 0.5 > "$RUNNER_TEMP/worker.log" 2>&1 &
          for _ in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8000/healthz && break
            sleep 1
          done
      - name: Seed a project, two plans and an API key
        id: seed
        run: uv run python scripts/ci_gate.py seed
      - name: Gate on a clean batch (must pass)
        uses: ./
        with:
          api-url: http://127.0.0.1:8000
          api-key: ${{ steps.seed.outputs.api-key }}
          plan: ci-clean
          timeout: "300"
      - name: Gate on re-sent rows (must fail)
        id: blocked
        continue-on-error: true
        uses: ./
        with:
          api-url: http://127.0.0.1:8000
          api-key: ${{ steps.seed.outputs.api-key }}
          plan: ci-resent
          timeout: "300"
      - name: The failing contract blocked the gate
        env:
          OUTCOME: ${{ steps.blocked.outcome }}
          VERDICT: ${{ steps.blocked.outputs.verdict }}
        run: |
          echo "outcome=$OUTCOME verdict=$VERDICT"
          test "$OUTCOME" = failure
          test "$VERDICT" = fail
      - name: Service logs
        if: always()
        run: tail -n 50 "$RUNNER_TEMP/serve.log" "$RUNNER_TEMP/worker.log"

  chaos:
    # FR-07.1 acceptance: each fault type observable on SandboxBank. Starts SandboxBank,
    # Toxiproxy, the socket proxy and the chaos agent, injects all seven fault types,
    # checks each effect and its recovery, and checks the socket proxy refuses the rest.
    # B-24 (S-03): every request is signed with a throwaway worker key; unsigned, forged,
    # replayed, expired and other-environment requests are refused.
    # B-25 (FR-07.3, D-01): the kill-switch drill; the watchdog reverts a fault after the
    # agent is killed, and kill --all works with no RAI API or database in the stack.
    name: Chaos agent (7 fault types)
    runs-on: ubuntu-latest
    env:
      COMPOSE_PROJECT_NAME: rai-chaos-ci
      # Compose interpolates every service, even those outside the active profiles.
      RAI_DB_PASSWORD: ci-only-not-secret
      LEDGER_DB_PASSWORD: ci-only-not-secret
      ANALYTICS_DB_PASSWORD: ci-only-not-secret
      ETL_INTERVAL_SECONDS: "2"
      RAI_WATCHDOG_GRACE_SECONDS: "3" # the drill waits for the watchdog, not 30 s
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Install
        run: uv sync --locked
      - name: Start SandboxBank and the chaos agent
        run: |
          DOCKER_GID="$(stat -c %g /var/run/docker.sock)"
          RAI_AGENT_WORKER_KEYS="$(uv run rai admin chaos-keygen --out "$RUNNER_TEMP/worker.pem")"
          export DOCKER_GID RAI_AGENT_WORKER_KEYS
          docker compose --profile sandbox --profile chaos up -d --build --wait
      - name: Inject and observe every fault type, with signed requests only
        run: uv run python scripts/chaos_e2e.py
        env:
          RAI_CHAOS_E2E_KEY: ${{ runner.temp }}/worker.pem
      - name: Service logs
        if: always()
        run: docker compose --profile sandbox --profile chaos logs --tail 40 rai-chaos-agent rai-chaos-watchdog socket-proxy payments-api etl-job
      - name: Stop
        if: always()
        run: docker compose --profile sandbox --profile chaos down -v

  tls:
    # B-36 (NFR-SEC-2, threat I-06): the core profile behind Caddy. HTTPS with Caddy's
    # local CA, security headers, no plain HTTP, no host port to rai-api, and the RAI
    # CLI's client through TLS (scripts/tls_e2e.py).
    name: TLS edge (Caddy)
    runs-on: ubuntu-latest
    env:
      COMPOSE_PROJECT_NAME: rai-tls-ci
      LEDGER_DB_PASSWORD: ci-only-not-secret # interpolated though unused here
      ANALYTICS_DB_PASSWORD: ci-only-not-secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Install
        run: uv sync --locked
      - name: Generated credentials (masked)
        run: |
          for name in RAI_DB_PASSWORD RAI_API_DB_PASSWORD RAI_JWT_SECRET; do
            value="$(uv run python -c 'import secrets; print(secrets.token_urlsafe(36))')"
            echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
          done
      - name: Database, migrations and the API's login role
        run: |
          docker compose --profile core up -d --wait rai-db
          export RAI_DATABASE_URL="postgresql://rai:${RAI_DB_PASSWORD}@127.0.0.1:55431/rai"
          uv run rai db upgrade
          uv run rai db set-api-password
      - name: Start rai-api behind Caddy
        run: docker compose --profile core up -d --build --wait
      - name: Check the TLS edge
        run: uv run python scripts/tls_e2e.py
      - name: Service logs
        if: always()
        run: docker compose --profile core logs --tail 40 rai-api caddy
      - name: Stop
        if: always()
        run: docker compose --profile core down -v

  secrets:
    name: Secret scan and hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: pre-commit hooks (gitleaks, hygiene)
        run: |
          python -m pip install pre-commit
          pre-commit run --all-files --show-diff-on-failure

  audit:
    name: Dependency audit
    if: github.event_name == 'schedule' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Audit locked dependencies
        run: |
          uv export --all-packages --all-extras --format requirements-txt --no-hashes --no-emit-workspace > requirements-audit.txt
          uvx pip-audit -r requirements-audit.txt
