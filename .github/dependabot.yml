# Keeps pinned dependencies current (threat model T-08, NFR-SEC-3).
# Version updates wait 14 days after a release, so a compromised or broken release
# has time to be noticed and yanked first (decision DEP-COOLDOWN). Security updates
# are not delayed: cooldown applies only to version updates.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    commit-message:
      prefix: ci
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    commit-message:
      prefix: build
    open-pull-requests-limit: 5
    # Generated from uv.lock (`uv export`, named in each header) and checked against it by
    # tests: Dependabot must change uv.lock, never these copies.
    exclude-paths:
      - chaos_agent/requirements.txt
      - deploy/rai/requirements.txt
      - deploy/build-requirements.txt
      - sandboxbank/requirements.txt
    ignore:
      # benchmarks/pyproject.toml caps pandas below 3: GX 1.x misreads pandas 3's string
      # dtype, so the B2 baseline would report false defects. Lift with that cap.
      - dependency-name: pandas
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    commit-message:
      prefix: build
    open-pull-requests-limit: 5
    groups:
      # Vite, its React plugin and Vitest peer-depend on each other's majors: one PR.
      vite-toolchain:
        patterns: ["vite", "vitest", "@vitejs/*", "@vitest/*"]
      # react and react-dom must be the same version, with their types.
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
  # Base images are pinned by tag and digest (B-40); these bump both, after the cooldown.
  - package-ecosystem: docker
    directories: [/chaos_agent, /deploy/caddy, /deploy/rai, /sandboxbank]
    ignore:
      # The UI build stage stays on a Node LTS line; odd majors are short-lived. Moved by hand.
      - dependency-name: node
        update-types: ["version-update:semver-major"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    commit-message:
      prefix: build
    open-pull-requests-limit: 5
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    commit-message:
      prefix: build
    open-pull-requests-limit: 5
