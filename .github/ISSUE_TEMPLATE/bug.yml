name: Bug
description: Something does not work as specified.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Security problems: do not file here. See SECURITY.md."
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce (synthetic data only)
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: RAI version or commit
  - type: input
    id: requirement
    attributes:
      label: Related requirement ID, if known
