[project]
name = "rai-sandboxbank"
version = "0.0.1"
description = "SandboxBank: synthetic payments system used as the reference system under test for RAI."
license = "Apache-2.0"
authors = [{ name = "Trevor Kauyu" }]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "psycopg-pool>=3.2",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "uvicorn>=0.30",
]

[project.scripts]
sandboxbank = "sandboxbank.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sandboxbank"]
