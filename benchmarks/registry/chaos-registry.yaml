# The S01-S20 chaos registry (B-28; Protocol section 5). Sealed: its SHA-256 is committed
# in docs/design/rai-protocol.md, and `rai-bench chaos-seal` refuses a plan whose
# registry differs. Never edit after the seal; a change is a deviation, recorded with
# its date, reason and who decided (Protocol section 10).
#
# Objectives as the author approved them on 2026-11-25 (review page
# https://claude.ai/artifact/NHJZq3YSRRM4ncaa8DGf7c): every RTO as listed, RPO 0 for all
# twenty (Q2, Q3), P2 and P3 recovery probed by the jobs' freshness probes (Q1).
#
# Allow-listed targets on SANDBOX-01 (registered by an admin; RAI never takes addresses
# from a scenario): ledger-db-proxy, analytics-db-proxy and model-api-proxy (Toxiproxy);
# payments-api, ledger-db, etl-job and feature-job (containers); payments-health
# (payments-api /readyz), payments-ledger (/v1/ledger/head), etl-ready (etl-job /readyz)
# and features-ready (feature-job /readyz) (http).
#
# recovery.window_seconds equals the RTO objective, so restoration is always awaited at
# least as long as the objective allows. A restart's 1 s duration is nominal: the agent
# restarts the container at once and holds nothing.
format: rai-bench-chaos-registry/1
scenarios:
- id: S01
  title: Ledger latency +200 ms (P1)
  repetitions: 10
  definition:
    blast_radius:
    - ledger-db-proxy
    faults:
    - type: latency
      target: ledger-db-proxy
      duration_seconds: 300
      latency_ms: 200
    recovery:
      probes: &id001
      - payments-health
      ledger: payments-ledger
      rto_seconds: 600
      rpo_seconds: 0
      window_seconds: 600
      stable_checks: 3
