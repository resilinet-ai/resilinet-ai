[project]
name = "rai-bench"
version = "0.0.1"
description = "Benchmark harness for the RAI Validation & Benchmark Protocol: runs the arms on sealed fixtures, records their alerts in one format and scores them against the answer key."
license = "Apache-2.0"
authors = [{ name = "Trevor Kauyu" }]
requires-python = ">=3.12"
dependencies = [
    "resilinet-ai",
    "rai-sandboxbank",
    "typer>=0.12",
]

[project.scripts]
rai-bench = "rai_bench.cli:app"

[tool.uv.sources]
resilinet-ai = { workspace = true }
rai-sandboxbank = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rai_bench"]
